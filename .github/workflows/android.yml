name: Android CI/CD

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Verify Tag Version Matches App Version
        if: startsWith(github.ref, 'refs/tags/v')
        id: check_version
        run: |
          # Extract tag version (removes 'refs/tags/' prefix)
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          # Remove the 'v' prefix for comparison
          TAG_VERSION="${TAG_VERSION#v}"

          # Extract versionName from app/build.gradle (.kts)
          APP_VERSION=$(./gradlew -q :app:printVersionName 2>/dev/null || ./gradlew -q printVersionName 2>/dev/null)

          # Fallback regex extraction if no Gradle task exists
          if [ -z "$APP_VERSION" ]; then
            APP_VERSION=$(grep -E 'versionName\s*=?\s*["'\'']' app/build.gradle* | head -n 1 | sed -E 's/.*versionName\s*=?\s*["'\''"]([^"'\'']+)["'\''"].*/\1/')
          fi

          echo "Git Tag Version (stripped): $TAG_VERSION"
          echo "App Version (extracted): $APP_VERSION"

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Version match failed!"
            echo "::error::If the tag is correct (v$TAG_VERSION), the App versionName must be exactly: $TAG_VERSION"
            echo "::error::If the App version is correct ($APP_VERSION), the Git tag should have been: v$APP_VERSION"
            echo "::error::Actual comparison -> Git Tag provided: '$TAG_VERSION' | App version found: '$APP_VERSION'"
            echo "match=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "Version match confirmed."
            echo "match=true" >> $GITHUB_OUTPUT
          fi

      - name: Build Release APKs
        if: startsWith(github.ref, 'refs/tags/') && steps.check_version.outputs.match == 'true'
        run: ./gradlew :app:assembleRelease

      - name: Sign APKs
        if: startsWith(github.ref, 'refs/tags/') && steps.check_version.outputs.match == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Clean up and Prepare Artifacts
        if: startsWith(github.ref, 'refs/tags/') && steps.check_version.outputs.match == 'true'
        run: |
          cd app/build/outputs/apk/release
          for file in *-signed.apk; do
            mv "$file" "${file/-signed.apk/.apk}"
          done
          rm -f *aligned.apk
          ls -la

      - name: Create Release and Upload APKs
        if: startsWith(github.ref, 'refs/tags/') && steps.check_version.outputs.match == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
